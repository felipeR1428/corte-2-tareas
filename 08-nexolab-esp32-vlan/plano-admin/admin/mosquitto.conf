# Configuración de Mosquitto para el plano de administración (VLAN 3).
#
# Mosquitto 2.x, por seguridad, SOLO escucha en localhost si no se le declara un listener; por eso
# hay que decirle explícitamente que escuche en 1883 en todas las interfaces del contenedor (así le
# llegan los contenedores de las zonas, por el router, y los ESP32 físicos, por el puerto publicado).
listener 1883 0.0.0.0

# Anónimo permitido (sin usuario ni contraseña) y sin TLS.
# Por qué está bien AQUÍ: es un laboratorio aislado; el broker solo es alcanzable desde las tres
# redes de Docker de la práctica y desde la red WiFi local donde están los ESP32, y lo que viaja
# son métricas de prueba, no datos sensibles. Además el firmware del ESP32 queda más simple.
# Qué se haría en producción:
#   - allow_anonymous false + password_file (usuarios con mosquitto_passwd), uno por dispositivo;
#   - acl_file para que cada cliente solo pueda escribir SUS tópicos (player-1 solo en
#     lab/+/player-1; solo el admin en lab/estado/#), así un dispositivo comprometido no puede
#     falsear el estado de otro;
#   - listener 8883 con TLS (cafile/certfile/keyfile) para que no se lea ni se altere en el aire;
#   - y el puerto no expuesto fuera de la VLAN de administración.
allow_anonymous true

# Sin persistencia en disco: los mensajes retenidos (lab/vivo/*, lab/estado/*) se reconstruyen
# solos en segundos al arrancar (cada cliente vuelve a publicar su "1" y el monitor sus estados),
# así que guardarlos solo dejaría estados viejos de una corrida anterior.
persistence false

# Todo el registro a la salida estándar: se ve con `docker logs` junto al del monitor.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S
